background_color:
  type: string
  default: "transparent"
  description: "Background color of the Unix time banner"

text_color:
  type: string
  default: "#08c"
  description: "Color of the Unix timestamp digits"

label_color:
  type: string
  default: "#aaaaaa"
  description: "Color of the 'unix time:' label"

font_size:
  type: string
  default: "42px"
  description: "Font size of the Unix time display (e.g., 42px, 2.5rem)"

show_label:
  type: bool
  default: true
  description: "Show the 'unix time:' label before the timestamp"
